[package]
name = "crabsland"
version = "0.1.5"
edition = "2024"

[dependencies]
chrome = { path = "chrome" }
leptos = { version = "0.8", features = ["csr"] }
leptos_i18n = "0.6"
gloo-net = { version = "0.6", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Navigator", "Clipboard", "HtmlElement", "Storage", "DomTokenList", "Element", "CustomEvent"] }

[package.metadata.leptos-i18n]
default = "en"
locales = ["en", "pt-PT", "es", "fr", "ru", "id"]
