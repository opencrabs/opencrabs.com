# The site is two crates: this one builds the landing page, and `chrome` holds
# the header and the footer that every page shares. They are listed as members
# so `cargo test` and `cargo run -p chrome --bin chrome-static` work from the
# repository root; the stats dashboard stays out because it carries its own
# Cargo.lock and builds with its own Trunk config.
[workspace]
members = ["chrome"]
# The stats dashboard is its own crate with its own Cargo.lock, built by its own
# Trunk config, so it is excluded rather than a member: being under this
# directory makes it look like a member otherwise, and `cargo metadata` refuses
# to build it at all.
exclude = ["stats"]
resolver = "2"

[package]
name = "crabsland"
version = "0.1.5"
edition = "2024"

[dependencies]
chrome = { path = "chrome" }
leptos = { version = "0.8", features = ["csr"] }
leptos_i18n = "0.6"
gloo-net = { version = "0.6", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Navigator", "Clipboard", "HtmlElement", "Storage", "DomTokenList", "Element", "CustomEvent"] }

[package.metadata.leptos-i18n]
default = "en"
locales = ["en", "pt-PT", "es", "fr", "ru", "id"]
