server {
    listen 19283;
    server_name localhost;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /sitemap.xml {
        default_type application/xml;
    }

    location = /robots.txt {
        default_type text/plain;
    }

    error_page 404 /404.html;

    # docs book: extensionless URLs need the .html fallback (same as server nginx)
    location /docs/ {
        try_files $uri $uri.html $uri/ =404;
    }

    # Public usage dashboard. Static wasm bundle; the data it draws comes from
    # /stats-data/ below, never from the proxy directly.
    location /stats/ {
        try_files $uri $uri/ /stats/index.html;
    }

    # Snapshot written by a systemd timer on the host every five minutes and
    # mounted read-only into this container. One minute of cache is enough: the
    # file itself only changes every five.
    location /stats-data/ {
        # No alias here on purpose: try_files resolves against the alias prefix
        # and ends up looking for stats-data/stats-data/public.json. The URI
        # already matches the path under the inherited root, so leave it alone.
        default_type application/json;
        add_header Cache-Control "public, max-age=60" always;
        try_files $uri =404;
    }

    # A missing path must answer 404, not 200 with the 404 page's body.
    # The last argument is a fallback URI, so /404.html here made every dead
    # link succeed: curl -fsSL swallowed the error page instead of failing.
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/wasm application/xml text/plain application/json;
}
