[build]
target = "index.html"
dist = "dist"
# The bundle is served from https://opencrabs.com/stats/, not from the site
# root, so every hashed asset URL must carry that prefix. Without this Trunk
# emits /stats-<hash>.js and the page 404s on load.
public_url = "/stats/"

[serve]
port = 19284

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "cp ../style.css ./style.css"]

# `/chrome.css` and `/chrome.js` are NOT copied into this dist. The dashboard is
# served from /stats/ and loads both from the site root, where the landing build
# puts them, so the header and the footer are the same two files on both pages
# instead of a per-page copy that can drift.
