[package]
name = "stats"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "stats"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
js-sys = "0.3"
chrome = { path = "../chrome" }
