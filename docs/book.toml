[book]
title = "OpenCrabs"
authors = ["Adolfo Usier"]
language = "en"
src = "src"
description = "Documentation for OpenCrabs, the free open-source AI agent. No account and no API key: it works from your terminal, Telegram, Discord, Slack and WhatsApp, and keeps going while you sleep."

[build]
build-dir = "book"

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/opencrabs/opencrabs"
site-url = "https://docs.opencrabs.com/"
no-section-label = false
cname = "docs.opencrabs.com"
additional-js = ["theme/custom.js"]
additional-css = ["theme/cards.css"]

[output.html.search]
enable = true
limit-results = 20
boost-hierarchy = 2




[preprocessor.gettext]
translations-dir = "po"
